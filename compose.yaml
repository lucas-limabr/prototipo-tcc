name: index-lab

services:
  postgres:
    image: postgres:17-bookworm
    container_name: index-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IXO_DB_NAME:?defina IXO_DB_NAME no .env}
      POSTGRES_USER: ${IXO_DB_USER:?defina IXO_DB_USER no .env}
      POSTGRES_PASSWORD: ${IXO_DB_PASSWORD:?defina IXO_DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:${IXO_DB_PORT:-55432}:5432"
    volumes:
      - /home/lucaslima/Compartilhada/DadosTCC2/postgres-data:/var/lib/postgresql/data
      - /home/lucaslima/Compartilhada/DadosTCC2/cnpj-data:/data:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
